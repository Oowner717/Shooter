<!doctype html>
<!--
  `preboot` is on the root element in the markup rather than added by script,
  so it is in force from the first byte the parser sees and there is no frame
  in which it is missing. It hides the interface until the interface is built:
  the title screen is markup, but its controls list and its build stamp are
  filled in by Hud, so between the stylesheet loading and the modules running
  there was a real screen -- correct fonts, correct layout, no controls, no
  BUILD -- for as long as the modules took to arrive. Hud removes the class as
  its last act. See the fallback in styles.css for what happens if it cannot.
-->
<html lang="en" class="preboot">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SIM 7749">
<meta name="theme-color" content="#04050a">
<meta name="color-scheme" content="dark">
<meta name="description" content="SIMULATION 7749 — a physics shooter. The shallow end of something.">
<title>SIMULATION 7749</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<link rel="stylesheet" href="./styles.css">

<script>
/*
 * Cache escape hatch. An early service worker served scripts cache-first from
 * a cache name that never changed, which could pin a device to the build it
 * first loaded. index.html is always fetched from the network, so this inline
 * check runs fresh even on a pinned device and can break the loop from inside:
 * on a build change it unregisters every worker, drops every cache and reloads
 * once. Costs one reload per deploy; the worker handles updates normally after.
 *
 * BUILD must match `BUILD` in src/config.js — scripts/check-build.mjs
 * enforces it. sw.js derives its own from the registration URL.
 */
(function () {
  var BUILD = '250';
  var KEY = 'sim7749-build';
  try {
    if (localStorage.getItem(KEY) === BUILD) return;
    if (!('serviceWorker' in navigator) || !('caches' in window)) {
      localStorage.setItem(KEY, BUILD);
      return;
    }
    Promise.all([navigator.serviceWorker.getRegistrations(), caches.keys()])
      .then(function (state) {
        var regs = state[0];
        var keys = state[1];
        // Nothing cached yet — a first visit has nothing stale to escape.
        if (!regs.length && !keys.length) {
          localStorage.setItem(KEY, BUILD);
          return null;
        }
        return Promise.all(regs.map(function (r) { return r.unregister(); }))
          .then(function () { return Promise.all(keys.map(function (k) { return caches.delete(k); })); })
          .then(function () {
            localStorage.setItem(KEY, BUILD);
            location.reload();
          });
      })
      .catch(function () { localStorage.setItem(KEY, BUILD); });
  } catch (err) {
    /* private mode has no localStorage — just load normally */
  }
}());
</script>
</head>
<body>

<div id="app">
  <!-- env() only resolves to a readable pixel value through a real computed
       property, so layout code measures this instead of a CSS variable. -->
  <div id="safeProbe" aria-hidden="true"></div>
  <canvas id="stage"></canvas>

  <!-- ============ HUD ============ -->
  <div id="ui">

    <header id="topbar">
      <!--
        The three readouts share one shrinkable box so that the menu button,
        which is the door to everything, can never be pushed off the right
        edge by a number growing. With a mid-run purse (1759 OBJECTS, 15921
        ENERGY) the button ran 4px off a 414 screen, 28 off a 390 and 40 off
        a 320: the chips are nowrap and nothing was allowed to give, so the
        overflow went to the last item in the row.
      -->
      <div id="barChips">
      <div id="counter" class="chip">
        <!-- Every object this run has destroyed, and nothing else. The
             per-wave figure that used to sit beside it went in build 222:
             two numbers about different things on one chip, and the one
             about the wave is on the rail and in AUDIT already. -->
        <span id="killNum">0</span>
        <em>OBJECTS</em>
      </div>
      <!--
        The way into the tree. Energy is what upgrades cost, so the number is
        the button: tapping what you have opens what it buys. It used to live
        one level down behind the hamburger, which put the most-used screen in
        the game behind two taps and a tab.
      -->
      <button id="energyChip" class="chip btn" aria-label="Upgrades">
        <em>ENERGY</em><span id="energyNum">0</span><i id="energyBuys"></i>
      </button>
      </div>
      <button id="menuBtn" class="chip btn menuBtn" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </header>

    <!--
      ============ THE LADDER ============

      Where the run is standing, as a rail rather than as a number.

      This used to be a chip in the bar reading "TIER 6" and a three-button
      row it opened into its own slot: two taps to see what the run was doing,
      and a number with no context around it. Six of what, out of how many,
      and going which way. The rail answers all three at a glance -- what is
      behind you carries a tick, what you are on is lit, what is ahead is an
      outline -- which is the whole reason for drawing it instead of counting.

      The nodes are a readout and not a control. Five of them across a 320
      screen is 33px each, which is under what a thumb can land on, and a rail
      you can mis-tap is a rail that drops you two tiers mid-wave. The three
      buttons are the control surface and they are sized for the hand.

      One row, and the row it was pictured from had two. Measured: a 69px band
      here puts the alerts column below the teaching band on a 568 screen and
      pillCap() goes to zero, so every receipt in the game queues and none of
      them is ever shown. The switch moves onto the end of the rail instead of
      under it, and the band costs 44.

      Everything here is driven by Hud.syncRail().
    -->
    <!--
      The wave sheet. Player-opened, so it holds the world the way the menu and
      the loadout do -- nothing in this game opens a modal by itself. The brief
      said "the way Offers do"; the Offers reward pool does not exist in this
      codebase, so it follows Game.paused, which is what actually holds a run.
    -->
    <section id="waveSheet" hidden>
      <div class="sheetHead">
        <span id="sheetTitle">WAVE</span>
        <button id="sheetClose" class="sheetX" aria-label="Close">&#215;</button>
      </div>
      <div id="sheetRoster" class="sheetRow"></div>
      <div id="sheetMeters"></div>
      <div class="sheetActs">
        <button id="sheetRecall" class="sheetAct" type="button">
          <b>RECALL</b><span>END IT AND TAKE WHAT IS CLEARED</span><i></i>
        </button>
        <button id="sheetOver" class="sheetAct" type="button">
          <b>OVERCLOCK</b><span>THE NEXT ONE, TWICE AS FAST, PAID DOUBLE</span><i></i>
        </button>
      </div>
    </section>
    <div id="waveRail">
      <button id="railDown" class="railStep" aria-label="Step back a tier">&#8249;</button>
      <div id="railNodes"></div>
      <button id="railUp" class="railStep" aria-label="Step up a tier">&#8250;</button>
      <!-- Straight to the highest rung the run has climbed. Present only when
           there is somewhere to skip to, so the rail is exactly as it was
           whenever the player is already at the top of what they have earned.
           A tier that has never been reached cannot be gone to at all: the
           arrow stops at the ceiling and the nodes past it are drawn shut. -->
      <button id="railSkip" class="railStep" aria-label="Jump to the highest tier reached" hidden>&#187;</button>
      <!-- Two labels, because "AUTO PROGRESS ON" does not fit beside five
           nodes and two arrows on a 320 screen and the state still has to be
           readable there. The stylesheet picks; both are written. -->
      <button id="railAuto" aria-label="Automatic progression">
        <span class="rLong"></span><span class="rShort"></span>
      </button>
    </div>

    <!-- What is running on a clock right now. Empty and out of the layout
         unless something timed is up; see Hud.syncEffects(). -->

    <!-- The way in, and the thing that comes through it. The banner is a
         control: it appears the moment an APERTURE is held and pressing it
         opens the hole. The bar under it is ORDINAL's, and only its. -->
    <!-- One row per boss whose way in is held, each in that boss's colour;
         built by Hud.syncBoss() from the anomaly table. It was a single
         button because there was a single boss. -->
    <div id="apertureBar" hidden></div>

    <!--
      ORDINAL's gauge. Three readings, not one:

        the core     the thing you are actually killing, with a ghost layer
                     that drains behind every hit so a big one is visible as
                     a hit and not only as a slightly shorter bar
        the frames   outer and inner, notched at their real segment counts,
                     because for most of the fight the frames are the work
        the stage    named, and marked on the core's own track at the health
                     the next one begins at

      Everything here is driven by Hud.syncBoss().
    -->
    <div id="bossBar" hidden>
      <div class="bossName">
        <span id="bossTitle">ORDINAL</span>
        <span id="bossPhase">I</span>
      </div>
      <div class="bossCore">
        <i class="bossGhost" id="bossGhost"></i>
        <i class="bossFill" id="bossFill"></i>
        <u class="bossNotch"></u>
        <b class="bossMark" id="bossMark3"></b>
        <b class="bossMark" id="bossMark4"></b>
      </div>
      <!-- One row per shell the boss says it has. ORDINAL has two frames;
           GNOMON has one dial and DYNAMO's shell is three pylons, so the
           rows are built from the boss's own gauge() rather than written
           down here. -->
      <div class="bossShell" id="bossShell"></div>
    </div>

    <!--
      ORDINAL's captions, and the transient pills, in one column.

      They were two absolutely positioned blocks at two fixed offsets, which
      is a promise that they will collide the moment three pills are up and a
      caption is reading — and they did, on a real phone, mid-outro. Sharing a
      flex column makes not overlapping a property of the layout rather than
      of two numbers agreeing. The caption is the first child, so pills stack
      underneath it and the big line keeps the top of the band.
    -->
    <div id="alerts">
      <div id="bossCaption"></div>
    </div>

    <!-- ============ OFFERS ============ -->
    <!-- Nothing here ever interrupts. The button appears when something is
         waiting and waits as long as it takes; opening it is what holds the
         world, and that is a choice the player made. -->

    <!-- The gold frame. Only a permanent upgrade ever lights it, it is drawn
         at the edge of the screen so it collides with nothing, and it is inert
         to the touch. -->

    <!-- The LOADOUT sheet that stood here -- which owned rounds and mines are
         on the strip -- is the AMMO and MINES tabs of the menu from build 226.
         Its rows and its door to the tree are built by Menu.buildLoadout and
         filled by Hud.syncLoadoutSheet, exactly as before; only the room they
         are in changed. -->

    <!-- ============ THE STRIP ============ -->
    <!-- Mines, the two that run on their own, then ammunition. Built from
         ARSENAL in src/arsenal.js — a new round or mine is a table entry and
         no markup. Everything here is live during play: tapping one never
         opens or pauses anything. -->
    <div id="quickBar"></div>

    <!-- ============ ABILITIES ============ -->
    <div id="abilityHint"></div>
    <nav id="abilities"></nav>

    <!-- ============ SANDBOX ============ -->
    <!-- The bench. One bar across the top and one sheet under it, both built
         by src/sandbox.js; hidden unless the run has bought SANDBOX and gone
         into it. `body.sandbox` is what takes the run's own chrome down. -->
    <section id="sandbox" aria-label="TESTBED" hidden></section>

    <!-- ============ MENU ============ -->
    <!-- Built from data in src/menu.js: a new round, assist or object needs a
         table entry and no markup. -->
    <div id="menuScrim"></div>
    <!-- Two menus in one sheet. The header is the switch between them --
         ARSENAL (what you fire, lay, buy) and SYSTEM (what things are, and
         the settings) -- and the row under it is that menu's tabs. Built from
         GROUPS in src/menu.js. Swipe the panel sideways to move through the
         tabs, and push the sheet down to close it. -->
    <section id="menu" aria-label="Menu">
      <header class="menuBar">
        <nav id="menuGroups" aria-label="Menus"></nav>
        <button id="menuClose" class="menuX" aria-label="Close menu">✕</button>
      </header>
      <nav id="menuTabs"></nav>
      <div id="menuPanels"></div>
    </section>

    <!-- ============ DEBUG ============ -->
    <section id="debugPanel" hidden>
      <div class="dbgHead">
        <strong>DEBUG</strong>
        <button class="x" id="dbgClose" aria-label="Close">✕</button>
      </div>
      <div class="dbgGrid" id="dbgGrid"></div>
      <!-- The spawn screen replaces the button grid rather than sitting under
           it: the panel is 280px wide on a phone and two screens fighting for
           that is worse than one screen at a time. Built by Hud.buildSpawn(). -->
      <div class="dbgSpawn" id="dbgSpawn" hidden></div>
      <div class="dbgStats" id="dbgStats"></div>
    </section>

    <!-- ============ BOOT SCREEN ============ -->
    <!--
      The title screen, rebuilt in build 227. It stands over a live arena --
      `phase = 'boot'` runs the field with drift in it, which is why the
      readout at the top can be real telemetry rather than decoration.

      One column, five things in it, in the order they are wanted: what this
      is, what this device has to show for it, the way in, how to play, and
      the way to throw it all away. There is exactly ONE primary button:
      CONTINUE when there is a run on disk, BEGIN SIMULATION when there is
      not. NEW RUN is gone -- it sat beside CONTINUE doing the destructive
      thing with the quieter label.
    -->
    <section id="boot">
      <div class="bootInner">
        <!-- Live: the dot breathes and the figure on the right is the object
             count of the arena running behind this panel. See Hud.syncBoot. -->
        <div class="bootStatus">
          <span class="bootDot" aria-hidden="true"></span>
          <span class="bootSess">SESSION 7749</span>
          <span class="bootLink">SHALLOWS OPEN</span>
          <span class="bootTele" id="bootTele" aria-hidden="true"></span>
        </div>

        <h1 class="bootMark"><span>SIMULATION</span><b>7749</b></h1>
        <p class="bootBody">
          A turret, an open field, and five hundred shapes standing in for
          something you have not met.
        </p>

        <!-- What this device has to show for itself, across every run. Only
             there once there is something to say; see Hud.showRecord(). -->
        <div id="bootRecord" hidden></div>

        <div class="bootGo">
          <button id="resumeBtn" hidden>CONTINUE</button>
          <button id="startBtn">BEGIN SIMULATION</button>
        </div>
        <!-- What is in the file, under the button rather than inside it. -->
        <div id="resumeNote" hidden></div>

        <!-- Filled from CONTROLS in src/narrative.js, which the menu's SYSTEM
             tab reads too, so the two cannot drift apart. -->
        <ul class="bootKeys"></ul>

        <div class="bootFoot">
          <!--
            The destructive one, small and last, and it asks for the word.
            Only shown when there is a save to destroy -- a RESET on a device
            with nothing on it is a button that cannot do anything. Pressing it
            opens the field below rather than arming a second press: a typed
            word cannot be hit by accident, which a second tap can.
          -->
          <button id="wipeBtn" class="bootWipe" type="button" hidden>RESET SIMULATION</button>
          <div id="wipeAsk" class="bootAsk" hidden>
            <label for="wipeWord">Type <b>DELETE</b> to wipe the saved run and begin again.</label>
            <div class="bootAskRow">
              <input id="wipeWord" type="text" inputmode="text" autocomplete="off"
                     autocapitalize="characters" autocorrect="off" spellcheck="false"
                     maxlength="6" aria-label="Type DELETE to confirm">
              <button id="wipeGo" type="button" disabled>WIPE</button>
              <button id="wipeNo" type="button" class="bootAskNo">CANCEL</button>
            </div>
          </div>
          <div class="bootBuild" id="bootBuild"></div>
          <div class="bootHome">Add to Home Screen for fullscreen playback.</div>
        </div>
      </div>
    </section>

  </div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
